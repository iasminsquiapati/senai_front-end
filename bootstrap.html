<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container mt-5">

  <h3>Cadastro</h3>

  <form>

    <!-- Nome -->
    <div class="mb-3">
      <label>Nome</label>
      <input type="text" class="form-control" required>
    </div>

    <!-- CPF -->
    <div class="mb-3">
      <label>CPF</label>
      <input type="text" id="cpf" class="form-control" required>
      <small id="msgCpf"></small>
    </div>

    <!-- CEP -->
    <div class="mb-3">
      <label>CEP</label>
      <input type="text" id="cep" class="form-control" required>
    </div>

    <!-- Endereço -->
    <div class="mb-3">
      <label>Endereço</label>
      <input type="text" id="endereco" class="form-control" required>
    </div>

    <!-- Número -->
    <div class="mb-3">
      <label>Número</label>
      <input type="text" class="form-control" required>
    </div>

    <!-- Complemento -->
    <div class="mb-3">
      <label>Complemento</label>
      <input type="text" class="form-control">
    </div>

    <!-- Bairro -->
    <div class="mb-3">
      <label>Bairro</label>
      <input type="text" id="bairro" class="form-control" required>
    </div>

    <!-- Cidade -->
    <div class="mb-3">
      <label>Cidade</label>
      <input type="text" id="cidade" class="form-control" required>
    </div>

    <!-- Estado -->
    <div class="mb-3">
      <label>Estado</label>
      <input type="text" id="estado" class="form-control" required>
    </div>

    <button class="btn btn-primary">Enviar</button>

  </form>

<script>

// Máscara CEP
$("#cep").on("input", function(){
  let valor = $(this).val().replace(/\D/g, "");
  if(valor.length > 5){
    valor = valor.slice(0,5) + "-" + valor.slice(5,8);
  }
  $(this).val(valor);
});

// Máscara CPF
$("#cpf").on("input", function(){
  let valor = $(this).val().replace(/\D/g, "");
  valor = valor.slice(0,11);

  if(valor.length > 9){
    valor = valor.replace(/(\d{3})(\d{3})(\d{3})(\d+)/, "$1.$2.$3-$4");
  } else if(valor.length > 6){
    valor = valor.replace(/(\d{3})(\d{3})(\d+)/, "$1.$2.$3");
  } else if(valor.length > 3){
    valor = valor.replace(/(\d{3})(\d+)/, "$1.$2");
  }

  $(this).val(valor);
});

// Validação simples CPF (apenas tamanho)
$("#cpf").on("blur", function(){
  let cpf = $(this).val().replace(/\D/g, "");

  if(cpf.length === 11){
    $("#msgCpf").text("CPF OK").css("color","green");
  } else {
    $("#msgCpf").text("CPF inválido").css("color","red");
  }
});

// Lista simples de endereços
let lista = [
  {
    cep: "87000-000",
    endereco: "Rua A",
    bairro: "Centro",
    cidade: "Maringá",
    estado: "PR"
  }
];

// Auto preencher
$("#cep").on("blur", function(){
  let cep = $(this).val();

  let dado = lista.find(e => e.cep === cep);

  if(dado){
    $("#endereco").val(dado.endereco);
    $("#bairro").val(dado.bairro);
    $("#cidade").val(dado.cidade);
    $("#estado").val(dado.estado);
  }
});

</script>

</body>
</html>
